---
# install-microshift tasks

- name: Check if microshift is installed
  ansible.builtin.command: rpm -q microshift
  register: microshift_installed
  ignore_errors: true
  changed_when: false

- name: Cleanup and uninstall existing microshift
  when: microshift_installed.rc == 0
  block:
    - name: Stop microshift service
      become: true
      ansible.builtin.systemd:
        name: microshift
        state: stopped
      ignore_errors: true

    - name: Find microshift cleanup script
      ansible.builtin.find:
        paths: /usr/bin
        patterns:
          - ".*microshift.*cleanup.*"
          - ".*cleanup.*microshift.*"
        use_regex: true
      register: find_cleanup

    - name: Cleanup microshift data
      become: true
      ansible.builtin.shell: echo 1 | {{ find_cleanup.files[0].path }} --all
      when: find_cleanup.files | length > 0

    - name: Uninstall microshift packages and dependencies
      become: true
      ansible.builtin.dnf:
        name:
          - microshift*
        autoremove: true
        state: absent

- name: Record initial disk space
  vars:
    filename: disk0.txt
  ansible.builtin.include_tasks: roles/common/tasks/disk.yml
  loop: "{{ du_dirs }}"

- name: Build & install microshift RPMs on RHEL
  when:
    - ansible_facts.distribution == "RedHat"
    - build_microshift | bool
  block:
    - name: Install cri-o
      become: true
      ansible.builtin.dnf:
        name:
          - cri-o
          - cri-tools
        state: present

    - name: Ensure microshift git checkout
      ansible.builtin.git:
        repo: "{{ microshift_repo }}"
        dest: "{{ microshift_dir }}"
        version: "{{ microshift_git_revision }}"
        refspec: "{{ microshift_git_refspec | default(omit, true) }}"
      when: not microshift_source_dir

    - name: Make clean
      ansible.builtin.command: make clean
      args:
        chdir: "{{ microshift_build_dir }}"

    - name: Make rpm
      ansible.builtin.command: make rpm
      args:
        chdir: "{{ microshift_build_dir }}"

    - name: Find built RPMs
      ansible.builtin.find:
        paths: "{{ microshift_rpm_repo_dir }}/RPMS"
        patterns: "*.rpm"
        recurse: true
      register: microshift_find

    - name: Make lists of built RPMs
      ansible.builtin.set_fact:
        microshift_rpms: "{{ microshift_find.files | map(attribute='path') | list }}"
        microshift_core_rpms: >-
          {{
            microshift_find.files | map(attribute='path') | map('basename')
            | select('match', '^microshift(-release-info|-selinux|-networking|-greenboot)?-[0-9]')
            | map('regex_replace', '\.rpm$', '') | list
          }}

    - name: Validate that core RPMs were built
      ansible.builtin.assert:
        that: microshift_core_rpms | length == 5
        fail_msg: "Expected 5 core MicroShift RPMs in the build output, found: {{ microshift_core_rpms }}"

    - name: Install all built microshift RPMs
      become: true
      ansible.builtin.dnf:
        name: "{{ microshift_rpms }}"
        state: present
        disable_gpg_check: true
      when: microshift_install_optional_rpms | bool

    - name: Install core microshift RPMs
      when: not (microshift_install_optional_rpms | bool)
      block:
        - name: Install createrepo
          become: true
          ansible.builtin.dnf:
            name: createrepo_c
            state: present

        - name: Create local RPM repository metadata
          ansible.builtin.command:
            argv:
              - createrepo_c
              - "{{ microshift_rpm_repo_dir }}"
          changed_when: true

        - name: Add local RPM repository
          become: true
          ansible.builtin.yum_repository:
            name: microshift-local
            description: MicroShift local build
            baseurl: "file://{{ microshift_rpm_repo_dir }}"
            enabled: false
            gpgcheck: false
            priority: 1

        - name: Install core microshift RPMs from local repository
          become: true
          ansible.builtin.dnf:
            name:
              - microshift
              - microshift-release-info
            enablerepo: microshift-local
            update_cache: true
            state: present

        - name: Validate that installed core RPMs match the build
          ansible.builtin.command:
            argv: "{{ ['rpm', '-q'] + microshift_core_rpms }}"
          changed_when: false
      always:
        - name: Remove local RPM repository
          become: true
          ansible.builtin.yum_repository:
            name: microshift-local
            state: absent

- name: Install microshift package on RHEL
  when:
    - ansible_facts.distribution == "RedHat"
    - not (build_microshift | bool)
  block:
    - name: Install microshift package
      become: true
      ansible.builtin.dnf:
        name: microshift
        state: present
        disable_gpg_check: true
      register: microshift_package_install
      until: microshift_package_install is succeeded
      retries: 2
      delay: 10

- name: Build & install etcd
  when:
    - build_etcd_binary | bool
    - not (build_microshift | bool)
  block:
    - name: Clone etcd git repo
      ansible.builtin.git:
        repo: "{{ etcd_repo }}"
        dest: "{{ etcd_dir }}"

    - name: Make etcd binary
      ansible.builtin.command: make
      args:
        chdir: "{{ etcd_dir }}"

    - name: Install etcd binary
      become: true
      ansible.builtin.copy:
        src: "{{ etcd_dir }}/bin/etcd"
        dest: "/usr/bin/etcd"
        remote_src: true
        mode: "0755"

    - name: Copy etcd systemd unit to node
      become: true
      ansible.builtin.copy:
        src: etcd.service
        dest: /usr/lib/systemd/system/etcd.service
        owner: root
        group: root
        mode: "0664"

    - name: Start etcd service
      become: true
      ansible.builtin.systemd:
        daemon_reload: true
        state: started
        name: etcd

- name: Check if pull-secret is present
  ansible.builtin.stat:
    path: /etc/crio/openshift-pull-secret
  register: pull_secret

- name: Copy pull-secret to node
  become: true
  ansible.builtin.copy:
    src: pull-secret.txt
    dest: /etc/crio/openshift-pull-secret
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not pull_secret.stat.exists

- name: Check if crio metrics config is present
  ansible.builtin.stat:
    path: "{{ crio_metrics_path }}"
  register: crio_metrics

- name: Enable crio metrics
  become: true
  ansible.builtin.copy:
    src: "{{ crio_metrics_conf }}"
    dest: "{{ crio_metrics_path }}"
    owner: root
    group: root
    mode: "0644"
  when: not crio_metrics.stat.exists
