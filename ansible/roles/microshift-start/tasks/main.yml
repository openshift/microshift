---
# microshift-start tasks

- name: Resolve kubernetes nodename
  ansible.builtin.include_tasks: roles/common/tasks/nodename.yml

- name: Check if microshift has run
  ansible.builtin.shell: systemctl show -p ActiveEnterTimestampMonotonic microshift | awk -F"=" '{print $2}'
  register: microshift_active
  ignore_errors: true

- name: Clean up existing MicroShift data
  when:
    - cleanup_microshift | default('true') | bool
    - microshift_active.stdout | int != 0
  block:
    - name: Find microshift cleanup script
      ansible.builtin.find:
        paths: /usr/bin
        patterns:
          - ".*microshift.*cleanup.*"
          - ".*cleanup.*microshift.*"
        use_regex: true
      register: find_cleanup

    - name: Set microshift_cleanup_bin variable
      ansible.builtin.set_fact:
        microshift_cleanup_bin: "{{ find_cleanup.files[0].path if find_cleanup.files }}"

    - name: Cleanup microshift data
      become: true
      ansible.builtin.shell: echo 1 | {{ microshift_cleanup_bin }} --all

- name: Disable microshift service
  become: true
  ansible.builtin.systemd:
    name: microshift
    state: stopped
    enabled: false

- name: Create .kube home dir
  ansible.builtin.file:
    path: ~/.kube/
    state: directory

- name: Reboot machine
  become: true
  ansible.builtin.reboot:
    reboot_timeout: 600

- name: Initialize results directory
  ansible.builtin.include_tasks: roles/common/tasks/results-dir.yml

- name: Record post-install disk utilization
  vars:
    filename: disk1.txt
  ansible.builtin.include_tasks: roles/common/tasks/disk.yml
  loop: "{{ du_dirs }}"

- name: Pause for 60 seconds for steady state post reboot
  ansible.builtin.pause:
    seconds: 60

- name: Pbench recording start
  become: true
  when: install_pbench | bool
  environment:
    PBENCH_TOOL_DATA_SINK: localhost:8081
  block:
    - name: Source pbench-agent & register-tool-set
      ansible.builtin.shell: source /etc/profile.d/pbench-agent.sh && pbench-register-tool-set

    - name: Set new pidstat interval
      ansible.builtin.shell: source /etc/profile.d/pbench-agent.sh && pbench-register-tool --name=pidstat -- --interval={{ sample_interval }}

    - name: Start pbench-user-benchmark recording
      ansible.builtin.shell: source /etc/profile.d/pbench-agent.sh && pbench-user-benchmark --config=microshift -- sleep {{ pbench_record_duration }}
      async: "{{ pbench_record_duration | int * 2 }}"
      poll: 0
      register: pbench_user_benchmark_result

    - name: Pause for 60 seconds to gather steady state for pbench tool recording
      ansible.builtin.pause:
        seconds: 60

- name: Record network measurement start epoch
  ansible.builtin.command: date +%s
  register: network_start_epoch

- name: Measure microshift service boot time
  ansible.builtin.include_tasks: roles/common/tasks/boot.yml
  vars:
    boot_output_filename: "boot0.txt"
    cleanup_microshift: false
    reboot: false

- name: Create service account task(s)
  ansible.builtin.include_tasks: roles/create-service-account/tasks/main.yml

- name: Finish pbench capture
  become: true
  when: install_pbench | bool
  environment:
    PBENCH_USER: microshift
  block:
    - name: Check on pbench-user-benchmark status
      ansible.builtin.async_status:
        jid: "{{ pbench_user_benchmark_result.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: 240
      delay: 15

    - name: Source pbench-agent & move results
      ansible.builtin.shell: source /etc/profile.d/pbench-agent.sh && pbench-move-results
      ignore_errors: true

- name: Record fully running disk utilization
  vars:
    filename: disk2.txt
  ansible.builtin.include_tasks: roles/common/tasks/disk.yml
  loop: "{{ du_dirs }}"

- name: Capture container image sizes
  block:
    - name: Copy crio-df script to remote host
      become: true
      ansible.builtin.copy:
        src: roles/common/tasks/files/crio-df.py
        dest: /tmp/crio-df.py
        mode: "0755"

    - name: Run crio-df script
      become: true
      ansible.builtin.command: python3 /tmp/crio-df.py -v
      register: crio_df

    - name: Save container image sizes to results
      ansible.builtin.copy:
        content: "{{ crio_df.stdout }}"
        dest: "{{ results_dir }}/images.txt"
      delegate_to: localhost

- name: Record network measurement end epoch
  ansible.builtin.command: date +%s
  register: network_end_epoch

- name: Resolve prometheus network query settings
  ansible.builtin.set_fact:
    prom_network_endpoint: >-
      {{
        prometheus_query_endpoint | default(
          'http://' ~
          (
            (
              hostvars[(groups['logging'] | default([]) | first)].ansible_host
              | default((groups['logging'] | default([]) | first))
            )
            if (groups['logging'] | default([]) | length > 0)
            else 'prometheus'
          )
          ~ ':' ~ (prometheus_port | default(9091) | string),
          true
        )
      }}
    prom_network_device: "{{ network_device | default(ansible_facts.default_ipv4.interface | default('enp5s0'), true) }}"
    prom_network_instance: "{{ kubernetes_nodename }}"
  when: prometheus_logging | bool

- name: Query prometheus for network transfer
  when: prometheus_logging | bool
  block:
    - name: Run prometheus network query
      ansible.builtin.command: >
        python3 roles/common/tasks/files/prom-network-query.py
        --prometheus {{ prom_network_endpoint }}
        --instance {{ prom_network_instance }}
        --device {{ prom_network_device }}
        {{ network_start_epoch.stdout }}
        {{ network_end_epoch.stdout }}
      register: prom_network
      delegate_to: localhost

    - name: Save network data to results
      ansible.builtin.copy:
        content: "{{ prom_network.stdout }}"
        dest: "{{ results_dir }}/network.txt"
      delegate_to: localhost
