---
# run-workloads default vars

temp_dest: "/tmp"
e2e_repo: "https://github.com/cloud-bulldozer/e2e-benchmarking.git"
e2e_path: "{{ temp_dest }}/e2e-benchmarking"
# e2e-benchmarking release to run; v2.9.18 or later is required for MicroShift.
e2e_git_revision: v2.10.4
# kube-burner-ocp release the wrapper downloads; 1.11.17 or later is required
# for MicroShift. kube_burner_url points the wrapper at another binary tarball.
kube_burner_version: "1.12.6"
kube_burner_url: ""
# Elasticsearch server for remote indexing. When metrics are collected the
# results are also indexed locally and saved under the results directory.
kube_burner_es_server: ""
kube_burner_es_index: ripsaw-kube-burner
kube_burner_pods_per_node: 245
kube_burner_pod_ready: "180000ms"
# network-policy creates ten pods per iteration.
kube_burner_iterations: 1
# Metrics are collected when the playbook manages Prometheus or when
# prometheus_query_endpoint names an external one.
kube_burner_metrics_enabled: "{{ (prometheus_logging | bool) or (prometheus_query_endpoint | default('', true) | length > 0) }}"
kube_burner_metrics_flags: "--metrics-profile=microshift-metrics.yml --local-indexing --prometheus-url={{ prometheus_endpoint }}"
kube_burner_workload_flags:
  node-density: "--pods-per-node={{ kube_burner_pods_per_node }} --pod-ready-threshold={{ kube_burner_pod_ready }}"
  node-density-cni: "--pods-per-node={{ kube_burner_pods_per_node }}"
  network-policy: ""
# Extra kube-burner-ocp flags appended to every workload.
kube_burner_extra_flags: ""
kube_burner_results_dir: "{{ hostvars[groups['microshift'] | first].results_dir }}/kube-burner"
kube_burner_kubeconfig: "{{ hostvars[groups['microshift'] | first].kubeconfig_dest_file }}"
post_run_pause_duration: 180

workloads_to_run:
  - { name: node-density, qps: 2, burst: 2 }
  - { name: node-density, qps: 4, burst: 4 }
  - { name: node-density, qps: 6, burst: 6 }
  - { name: node-density, qps: 8, burst: 8 }
  - { name: node-density, qps: 10, burst: 10 }
  - { name: node-density, qps: 12, burst: 12 }
  - { name: node-density-cni, qps: 2, burst: 2 }
  - { name: node-density-cni, qps: 4, burst: 4 }
  - { name: node-density-cni, qps: 6, burst: 6 }
  - { name: node-density-cni, qps: 8, burst: 8 }
  - { name: node-density-cni, qps: 10, burst: 10 }
  - { name: node-density-cni, qps: 12, burst: 12 }
