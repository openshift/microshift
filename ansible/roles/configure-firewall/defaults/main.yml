---
# configure-firewall default vars

firewall_services:
  - http
  - https
  - mdns

firewall_ports:
  - 80/tcp
  - 443/tcp
  - 2379/tcp
  - 3000/tcp
  - 5353/udp
  - 6443/tcp
  - 8080/tcp
  - 9091/tcp
  - 9100/tcp
  - 9256/tcp
  - 9537/tcp
  - 10250/tcp
  - 17001/tcp
  - 30000-32767/tcp
  - 30000-32767/udp

# Local pod network, OVN-Kubernetes masquerade and IPv6 pod networks, plus C2CC peers
firewall_trusted_cidr: >-
  {{ (microshift_network.cluster_network | default(['10.42.0.0/16']))
     + ['169.254.169.1/32', 'fd01::/48']
     + (c2cc_remote_cidrs | default([])) }}
