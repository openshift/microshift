---
# setup-microshift-host tasks

- name: Install firewalld & packages
  ansible.builtin.dnf:
    name: "{{ install_packages }}"
    state: present
    update_cache: true

- name: Determine system architecture
  ansible.builtin.set_fact:
    go_arch: amd64
  when: ansible_facts['architecture'] == "x86_64"

- name: Create target directory for go version
  ansible.builtin.file:
    path: "{{ go_install_dir }}"
    state: directory

- name: Download & extract newer version of golang
  ansible.builtin.unarchive:
    src: https://go.dev/dl/go{{ go_version }}.linux-{{ go_arch }}.tar.gz
    dest: "{{ go_install_dir }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"

- name: Create symbolic links
  ansible.builtin.file:
    src: "{{ go_install_dir }}/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  with_items: "{{ go_files }}"

- name: Unmask firewalld if masked
  ansible.builtin.systemd:
    name: firewalld
    masked: false

- name: Start and enable firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Check if rhel vg exists
  ansible.builtin.command: vgdisplay -s {{ vg_name }}
  register: rhel_vg_present
  ignore_errors: true

- name: Check if lvm disk exists
  ansible.builtin.stat:
    path: "{{ lvm_disk }}"
  register: lvm_disk_stat
  when: rhel_vg_present.rc != 0

- name: Create a volume group on top of secondary disk for topolvm
  community.general.lvg:
    vg: "{{ vg_name }}"
    pvs: "{{ lvm_disk }}"
  when:
    - rhel_vg_present.rc != 0
    - lvm_disk_stat.stat.exists

- name: Notify about missing lvm disk
  ansible.builtin.debug:
    msg: "LVM disk {{ lvm_disk }} not found, skipping TopoLVM volume group creation"
  when:
    - rhel_vg_present.rc != 0
    - lvm_disk_stat is defined
    - not lvm_disk_stat.stat.exists

- name: Check if volume group exists
  ansible.builtin.command: vgdisplay -s {{ vg_name }}
  register: vg_exists
  changed_when: false
  failed_when: false

- name: Configure TopoLVM storage
  ansible.builtin.include_tasks: storage.yml
  when:
    - vg_name != default_vg_name
    - vg_exists.rc == 0

- name: Pin RHEL version to prevent upgrading beyond supported release
  become: true
  ansible.builtin.copy:
    content: "{{ rhel_target_version }}"
    dest: /etc/dnf/vars/releasever
    mode: "0644"
  when: rhel_target_version is defined

- name: Upgrade all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    nobest: true
  notify: reboot machine

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
