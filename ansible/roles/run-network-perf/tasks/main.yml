---
# run-network-perf tasks: run network-perf-v2 (client and server on the same node)
# against every selected MicroShift host's cluster at once from the control node, each
# with its own kubeconfig, checkout and results directory. network-perf.yml uses the
# task files one by one and adds the run across clusters.

- name: Set the campaign of this run
  ansible.builtin.include_tasks: campaign.yml

- name: Check this host's cluster
  ansible.builtin.include_tasks: prepare.yml

- name: Run the same-node workload
  ansible.builtin.include_tasks: same-node.yml
  when: network_perf_same_node_selected | bool

- name: Compare the benchmark images
  ansible.builtin.include_tasks: image-check.yml
