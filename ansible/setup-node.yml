---
# Setup MicroShift nodes
#
# Example Usage:
#
# ansible-playbook -i inventory/inventory setup-node.yml
#

- name: Create vm and set up localhost
  hosts: localhost
  tags: [localhost]
  become: false
  vars:
    ansible_connection: local
  vars_files:
    - vars/all.yml
  roles:
    - role: create-vm
      when: (create_devenv | bool)
    - role: setup-localhost

- name: Entitle host and manage repos
  hosts: microshift
  tags: [repos]
  become: true
  vars_files:
    - vars/all.yml
  roles:
    - role: manage-repos
      when: (manage_repos | bool)

- name: Install packages, configure services & firewall
  hosts: microshift
  tags: [host]
  become: true
  vars_files:
    - vars/all.yml
  roles:
    - role: setup-microshift-host
      when: (setup_microshift_host | bool)
    - role: configure-firewall
      when: (setup_microshift_host | bool)
    - role: install-logging-exporters
      when: (prometheus_logging | bool)

- name: Install microshift
  hosts: microshift
  tags: [install]
  vars_files:
    - vars/all.yml
  roles:
    - role: install-microshift
      when: (install_microshift | bool)

- name: Resolve microshift nodename
  hosts: microshift
  tags: [nodename]
  vars_files:
    - vars/all.yml
  tasks:
    - name: Resolve kubernetes nodename
      ansible.builtin.include_tasks: roles/common/tasks/nodename.yml

- name: Set up logging node
  hosts: logging
  tags: [logging]
  vars_files:
    - vars/all.yml
  roles:
    - role: install-logging
      when: (prometheus_logging | bool)

- name: Capture microshift metrics
  hosts: microshift
  tags: [start]
  vars_files:
    - vars/all.yml
  roles:
    - role: microshift-start

- name: Add kubelet endpoint to prometheus
  hosts: logging
  tags: [logging]
  gather_facts: false
  vars_files:
    - vars/all.yml
  roles:
    - role: add-kubelet-logging
      when: (prometheus_logging | bool)

- name: Capture microshift metrics (warm)
  hosts: microshift
  tags: [warm]
  vars_files:
    - vars/all.yml
  roles:
    - role: quick-microshift-boot

- name: Setup NVIDIA GPU support
  hosts: microshift
  tags: [gpu]
  become: true
  vars_files:
    - vars/all.yml
  roles:
    - role: nvidia-gpu-setup
      when: (enable_gpu | bool)

- name: Pull kubeconfig from microshift host
  hosts: microshift
  tags: [kubeconfig]
  vars_files:
    - vars/all.yml
  roles:
    - role: fetch-kubeconfig

- name: Deploy GPU test workload
  hosts: microshift
  tags: [gpu]
  become: true
  vars_files:
    - vars/all.yml
  roles:
    - role: nvidia-gpu-test
      when: (enable_gpu | bool) and (deploy_gpu_test | bool)

- name: Run performance workloads
  hosts: localhost
  tags: [workloads]
  become: false
  vars:
    ansible_connection: local
  vars_files:
    - vars/all.yml
  roles:
    - role: run-workloads
      when: (run_workloads | bool)
