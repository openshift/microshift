[main]
summary=Optimized for running low latency workloads on MicroShift
include=cpu-partitioning

[variables]
include=/etc/tuned/microshift-baseline-variables.conf
offline_cpu_set_expanded=${f:cpulist_unpack:${offline_cpu_set}}

[bootloader]
cmdline_microshift_hp=+hugepagesz=${hugepages_size} hugepages=${hugepages}
cmdline_microshift_extra=+${additional_args}

[sysctl]
kernel.sched_rt_runtime_us=-1
# kernel.timer_migration (0 from cpu-partitioning via network-latency) is set below
# per kernel. Dropping it here keeps `tuned-adm verify` consistent with what is applied.
drop=kernel.timer_migration

# On RHEL 9 kernels, kernel.timer_migration=0 keeps a timer on the CPU it was armed on.
# Timers armed on isolated CPUs before a workload is pinned there (e.g. TCP keepalive
# and neighbour timers of pods that ran there) then keep firing on them. On the RT
# kernel their softirq thread (ktimers/N, SCHED_FIFO:1) is starved by a SCHED_FIFO
# busy-polling workload and the tick never stops on that CPU, causing periodic latency
# spikes. Allowing migration moves such timers to housekeeping CPUs. It may affect
# hrtimer based measurements such as cyclictest. RHEL 10 kernels reworked timer
# management and are not affected. Same as OpenShift's performance profile:
# https://github.com/openshift/cluster-node-tuning-operator/blob/14d18a5900e060a39c1f092ea344480f8ebe16ae/assets/performanceprofile/tuned/openshift-node-performance#L125-L146
[sysctl.timer-migration-rhel9]
type=sysctl
# Match .el9.x86_64 or .el9_<minor>, but not .el10.
uname_regex=\.el9[ _.]
kernel.timer_migration=1

# Any other kernel keeps the cpu-partitioning value.
[sysctl.timer-migration-other]
type=sysctl
uname_regex=^(?!.*\.el9[ _.])
kernel.timer_migration=0

[script]
priority=5
script=${i:PROFILE_DIR}/script.sh
