apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${PVCNAME}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: ${PVCCAPACITY}
  storageClassName: ${SCNAME}
  volumeMode: ${VOLUMEMODE}
  dataSource:
    name: ${SNAPSHOTNAME}
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
