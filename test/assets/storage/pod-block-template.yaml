apiVersion: v1
kind: Pod
metadata:
  name: ${PODNAME}
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: ${PODNAME}
    image: ${IMAGE}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    volumeDevices:
    - name: data
      devicePath: ${DEVICEPATH}
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: ${PVCNAME}
