kind: Pod
apiVersion: v1
metadata:
  name: base
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: test-container
    image: quay.io/microshift/busybox:1.36
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    command:
    - sh
    - -c
    - sleep 1d
    volumeMounts:
    - mountPath: /vol
      name: test-vol
  volumes: []