name = "rhel-9.8-microshift-source-tuned"
description = "A RHEL 9.8 image with MicroShift and Low Latency RPMs built from source."
version = "0.0.1"
modules = []
groups = []
distro = "rhel-98"

{{ range (env.Getenv "MICROSHIFT_MANDATORY_RPMS" | strings.Split " ") }}
[[packages]]
name = "{{ . }}"
version = "{{ env.Getenv "SOURCE_VERSION" }}"
{{ end }}

[[packages]]
name = "microshift-low-latency"
version = "{{ .Env.SOURCE_VERSION }}"

# TEMPORARY WORKAROUND (revert when the tuned bug is fixed):
# tuned 2.28.0-1.el9fdp regressed the [bootloader] plugin so that
# microshift-baseline kernel args are no longer persisted to the ostree
# bootloader (tuned-adm returns 0 but /proc/cmdline is unchanged after
# reboot), which fails the low-latency Profile suite across presubmits.
# Pin to the last-known-good 2.27.0 build until the tuned team ships a fix.
# Tracking: RHEL-261119 (tuned), related RHEL-170825 / RHEL-210923.
[[packages]]
name = "tuned"
version = "2.27.0-2.1.20270724git0eb28ac3.el9fdp"

[[packages]]
name = "tuned-profiles-cpu-partitioning"
version = "2.27.0-2.1.20270724git0eb28ac3.el9fdp"

[[packages]]
name = "microshift-test-agent"
version = "*"

[[packages]]
name = "systemd-resolved"
version = "*"

{{- if and (env.Getenv "UNAME_M" "") (eq "x86_64" .Env.UNAME_M) }}
# Kernel RT is only available for x86_64
[customizations.kernel]
name = "kernel-rt"
{{- end }}

[customizations.services]
enabled = ["microshift-test-agent", "microshift", "microshift-tuned"]

[customizations.firewall]
ports = ["22:tcp", "80:tcp", "443:tcp", "5353:udp", "6443:tcp", "30000-32767:tcp", "30000-32767:udp"]

[customizations.firewall.services]
enabled = ["mdns", "ssh", "http", "https"]

[[customizations.firewall.zones]]
name = "trusted"
sources = ["10.42.0.0/16", "169.254.169.1", "fd01::/48"]

[[customizations.files]]
path = "/etc/microshift/config.yaml"
data = """
kubelet:
  cpuManagerPolicy: static
  cpuManagerPolicyOptions:
    full-pcpus-only: "true"
  cpuManagerReconcilePeriod: 5s
  memoryManagerPolicy: Static
  topologyManagerPolicy: single-numa-node
  reservedSystemCPUs: 0-1
  reservedMemory:
  - limits:
      memory: 1100Mi
    numaNode: 0
  kubeReserved:
    memory: 500Mi
  systemReserved:
    memory: 500Mi
  evictionHard:
    imagefs.available: 15%
    memory.available: 100Mi
    nodefs.available: 10%
    nodefs.inodesFree: 5%
  evictionPressureTransitionPeriod: 0s
"""

[[customizations.files]]
path = "/etc/tuned/microshift-baseline-variables.conf"
data = """
# Isolated cores should be complementary to kubelet's reserved CPUs.
# Isolated and reserved CPUs should contain all online CPUs.
# Core #3 is for testing offlining hence skipped.
isolated_cores=2,4-5
hugepages_size=2M
hugepages=10
additional_args=test1=on test2=true dummy
offline_cpu_set=3
"""

[[customizations.files]]
path = "/etc/microshift/tuned.yaml"
data = """
profile: microshift-baseline
reboot_after_apply: True
"""
